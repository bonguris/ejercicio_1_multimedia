<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>boygenius</title>

<style>

body{
    font-family: Helvetica, Arial, sans-serif;
    background-color: #2b2b2b;
    color: red;
    text-align: center;
    margin: 0;
}

h1{
    margin: 40px;
    font-weight: bold;
    font-style: italic;
}

h2{
    margin: 40px;
    font-weight: bold;
    font-style: italic;
}

.galeria{
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 40px;
}

.item{
    position: relative;
    width: 30%;
    text-decoration: none;
}

.item img{
    width: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
    border-radius: 8px;
}

.texto{
    font-family: Helvetica, Arial, sans-serif;
    color: red;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.3s;
}

.titulo{
    font-size: 22px;
    font-weight: bold;
    font-style: italic;
}

.subtitulo{
    font-size: 15px;
}

.item:hover img{
    filter: brightness(40%);
    transform: scale(1.1);
}

.item:hover .texto{
    font-family: Helvetica, Arial, sans-serif;
    color: red;
    opacity: 1;
}

</style>
</head>

<body>

<h1>boygenius</h1>
<h2>Supergrupo estadounidense de indie rock</h2>

<div class="galeria">

 <! -- All photos by David Lee from Redmond, WA, USA. Compilation by GiankM. M -->

    <img src="recursos/phoebe.png" alt="Phoebe Bridgers">
    <div class="texto">
        <div class="titulo">Phoebe Bridgers</div>
        <div class="subtitulo">Pasadena, CA, 17 de agosto de 1994</div>
    </div>
</a>

<a href="julien.html" class="item">
    <img src="recursos/julien.png" alt="Julien Baker">
    <div class="texto">
        <div class="titulo">Julien Baker</div>
        <div class="subtitulo">Germantown, TN, 29 de septiembre de 1995</div>
    </div>
</a>

<a href="lucy.html" class="item">
    <img src="recursos/lucy.png" alt="Lucy Dacus">
    <div class="texto">
        <div class="titulo">Lucy Dacus</div>
        <div class="subtitulo">Richmond, VA, 2 de mayo de 1995</div>
    </div>
</a>

</div>

</body>
</html>
